name: Integration

# Exercises the crate as PUBLISHED on crates.io, against staging. CI compiles
# this working tree; nothing there would notice a tag that never landed, an
# `exclude` that dropped a module from the package, or a feature a consumer
# cannot turn on.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  schedule:
    # Off the hour on purpose: scheduled runs bunched at :00 are queued behind
    # everyone else's and can be dropped entirely under load.
    - cron: '31 6 * * *'

jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # No cache: the point is the download a stranger gets from the
          # registry, and a warm one could serve a version that has since been
          # yanked.
          cache: false
      # One entry point, used identically by a human and by this job: it skips
      # with a reason when nothing published satisfies the requirement, and the
      # suite skips from inside itself when the key is missing.
      #
      # One key, because there is no plan ladder here: an organization either
      # licenses a database or it does not. A secret that does not exist
      # interpolates to an empty string, which the suite treats as absent.
      - run: ./scripts/run.sh
        working-directory: integration
        env:
          INTERNETDATA_STAGING_KEY: ${{ secrets.INTERNETDATA_STAGING_KEY }}
