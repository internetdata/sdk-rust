[package]
name = "internetdata"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "The official Rust client library for the InternetData API: download and verify the published IP intelligence databases."
authors = ["InternetData <dev@internetdata.io>"]
license = "MIT"
readme = "README.md"
homepage = "https://internetdata.io"
repository = "https://github.com/internetdata/sdk-rust"
documentation = "https://docs.rs/internetdata"
keywords = ["ip", "geoip", "mmdb", "dataset", "api"]
categories = ["api-bindings", "network-programming"]
exclude = ["/spec", "/scripts", "/.github", "/integration"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls", "reqwest/rustls-native-certs"]
native-tls = ["reqwest/default-tls"]

[package.metadata.docs.rs]
all-features = true
