[package]
name = "internetdata"
version = "2.9.0"
edition = "2024"
rust-version = "1.85"
description = "The official Rust client library for the InternetData API: look up IP addresses, AS numbers and domains, and download the IP intelligence databases."
authors = ["InternetData <dev@internetdata.io>"]
license = "MIT"
readme = "README.md"
homepage = "https://internetdata.io"
repository = "https://github.com/internetdata/sdk-rust"
documentation = "https://docs.rs/internetdata"
keywords = ["ip", "geoip", "mmdb", "dataset", "api"]
categories = ["api-bindings", "network-programming"]
exclude = ["/spec", "/scripts", "/.github", "/integration"]

[dependencies]
# chrono and tokio are floored past the advisories their older releases carry:
# cargo checks none, so a lock already holding one would keep it.
chrono = { version = "0.4.20", features = ["serde"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The PKCE verifier's 32 bytes, from the system's secure random source.
getrandom = "0.4"
indexmap = "2"
ipnet = "2"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The PKCE challenge, SHA-256 over the verifier.
sha2 = { version = "0.11", default-features = false }
tokio = { version = "1.44.2", features = ["fs", "io-util", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.44.2", features = ["macros", "rt-multi-thread", "net", "time"] }
# Already in the build through reqwest's form and query features. The OAuth
# tests decode each request body with it.
serde_urlencoded = "0.7"

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/default-tls"]

[package.metadata.docs.rs]
all-features = true
